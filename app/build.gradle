apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    // buildToolsVersion "26.0.0"
    defaultConfig {
        applicationId "com.vone.qrcode"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode Integer.parseInt(System.getenv('VMQ_VERSION_CODE') ?: '310000')
        versionName System.getenv('VMQ_VERSION_NAME') ?: '3.1.0-wstimin-dev'
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('VMQ_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile rootProject.file(keystorePath)
            }
            storePassword System.getenv('VMQ_KEYSTORE_PASSWORD')
            keyAlias System.getenv('VMQ_KEYSTORE_ALIAS')
            keyPassword System.getenv('VMQ_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'com.android.support:appcompat-v7:28.0.0'
    // implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'com.squareup.okhttp3:okhttp:3.7.0'
    implementation 'com.squareup.okio:okio:1.12.0'
    testImplementation 'junit:junit:4.12'
}
